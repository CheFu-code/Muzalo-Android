name: Muzalo Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: muzalo-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: '1'
      NODE_ENV: production
      EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
      ORG_GRADLE_PROJECT_MUZALO_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_MUZALO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_MUZALO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Repair expo-asset publication metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.dirname(require.resolve('expo-asset/package.json'));
          const packageInfo = require(path.join(root, 'package.json'));
          const configPath = path.join(root, 'expo-module.config.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const android = config.android || {};
          if (android.publication && !android.publication.version) {
            android.publication.version = packageInfo.version;
            fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
            console.log('Repaired expo-asset publication version:', packageInfo.version);
          } else {
            console.log('expo-asset publication metadata needs no repair');
          }
          NODE

      - name: Patch Track Player Kotlin nullable Bundle compatibility
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const source = path.join('node_modules', 'react-native-track-player', 'android', 'src', 'main', 'java', 'com', 'doublesymmetry', 'trackplayer', 'module', 'MusicModule.kt');
          let code = fs.readFileSync(source, 'utf8');
          const oldTrack = 'Arguments.fromBundle(musicService.tracks[index].originalItem)';
          const newTrack = 'musicService.tracks[index].originalItem?.let { Arguments.fromBundle(it) }';
          const oldActive = 'Arguments.fromBundle(\\n                musicService.tracks[musicService.getCurrentTrackIndex()].originalItem\\n            )'.replaceAll('\\n', '\n');
          const newActive = 'musicService.tracks[musicService.getCurrentTrackIndex()].originalItem?.let { Arguments.fromBundle(it) }';
          if (!code.includes(oldTrack) || !code.includes(oldActive)) {
            throw new Error('Track Player Kotlin code differs from expected v4.1.2; refusing unsafe patch');
          }
          code = code.replace(oldTrack, newTrack).replace(oldActive, newActive);
          fs.writeFileSync(source, code);
          console.log('Patched nullable Bundle conversion in Track Player getTrack/getActiveTrack');
          NODE

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Diagnose Expo Android autolinking publications
        run: |
          npx --no-install expo-modules-autolinking resolve --platform android --json > /tmp/expo-autolinking.json
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/expo-autolinking.json', 'utf8').trim();
          if (!raw) throw new Error('Expo autolinking CLI returned empty JSON');
          const data = JSON.parse(raw);
          const modules = data.modules || [];
          console.log('Expo autolinking modules:', modules.length);
          let invalid = 0;
          modules.forEach((mod, i) => {
            for (const [j, project] of (mod.projects || []).entries()) {
              if (project.publication && !project.publication.version) {
                invalid++;
                console.error('INVALID EXPO PUBLICATION:', JSON.stringify({
                  moduleIndex: i, projectIndex: j, module: mod.packageName || mod.name,
                  path: mod.path, publication: project.publication
                }));
              }
            }
          });
          if (invalid) console.warn(invalid + ' publication metadata entries missing version; Gradle will verify source-build configuration.');
          NODE

      - name: Enable Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_MUZALO_STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_MUZALO_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS secret'; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_MUZALO_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD secret'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-upload.jks
          chmod 600 android/app/release-upload.jks

      - name: Configure release signing
        run: |
          cat > android/app/ci-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  ciRelease {
                      storeFile file('release-upload.jks')
                      storePassword project.property('MUZALO_STORE_PASSWORD')
                      keyAlias project.property('MUZALO_KEY_ALIAS')
                      keyPassword project.property('MUZALO_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ciRelease
                  }
              }
          }
          GRADLE
          printf '\napply from: "ci-signing.gradle"\n' >> android/app/build.gradle

      - name: Allow Gradle wrapper execution
        run: chmod +x android/gradlew

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --build-cache --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muzalo-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: muzalo-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
